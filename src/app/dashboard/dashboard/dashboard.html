<div class="dashboard-container">

  <div class="dashboard-header">
    <div>
      <h1>Tableau de bord</h1>
      <p>Bienvenue, <strong>{{ email }}</strong> — {{ today | date:'EEEE dd MMMM yyyy' }}</p>
    </div>
    <div class="parc-filter">
      <label>🏥 Filtrer par parc :</label>
      <select [(ngModel)]="selectedParc" (ngModelChange)="filterByParc()" class="parc-select">
        <mat-option value="">Tous les parcs</mat-option>
        <mat-option *ngFor="let p of parcs" [value]="p">{{ p }}</mat-option>
      </mat-select>
    </div>
  </div>

  <ng-container *ngIf="!isLoading">

    <div *ngIf="selectedParc" class="parc-banner">
      🏥 Tableau de bord filtré pour : <strong>{{ selectedParc }}</strong>
      <span> — {{ totalEquipements }} équipement(s)</span>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="kpi-icon">🔧</div>
        <div class="kpi-info"><h2>{{ totalInterventions }}</h2><p>Interventions</p></div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-icon">🔬</div>
        <div class="kpi-info"><h2>{{ totalEquipements }}</h2><p>Équipements</p></div>
      </div>
      <div class="kpi-card orange">
        <div class="kpi-icon">⏱️</div>
        <div class="kpi-info"><h2>{{ (mttr ?? 0) | number:'1.0-1' }}h</h2><p>MTTR moyen</p></div>
      </div>
      <div class="kpi-card purple">
        <div class="kpi-icon">📄</div>
        <div class="kpi-info"><h2>{{ totalContrats }}</h2><p>Contrats actifs</p></div>
      </div>
      <div class="kpi-card teal">
        <div class="kpi-icon">✅</div>
        <div class="kpi-info"><h2>{{ disponibilite }}%</h2><p>Disponibilité</p></div>
      </div>
    </div>

    <!-- 3 TABLEAUX -->
    <div class="tables-grid">

      <!-- Planning du mois -->
      <div class="table-card">
        <div class="table-header blue-header">
          <span>📅 Planning du mois</span>
          <span class="badge">{{ planningDuMois.length }}</span>
        </div>
        <div class="table-body">
          <table *ngIf="planningDuMois.length > 0">
            <thead>
              <tr><th>Date</th><th>Type</th><th>Équipement</th><th>Statut</th></tr>
            </thead>
            <tbody>
              <tr *ngFor="let i of planningDuMois" (click)="navigateTo('/interventions/' + i.id)" class="clickable">
                <td>{{ i.dateIntervention | date:'dd/MM' }}</td>
                <td>{{ i.type }}</td>
                <td>{{ i.equipement?.nom || '—' }}</td>
                <td><span [class]="'badge-statut ' + getStatutClass(i.statut)">{{ i.statut }}</span></td>
              </tr>
            </tbody>
          </table>
          <div *ngIf="planningDuMois.length === 0" class="empty-state">Aucune intervention ce mois-ci</div>
        </div>
      </div>

      <!-- Interventions non terminées -->
      <div class="table-card">
        <div class="table-header orange-header">
          <span>⚠️ Interventions non terminées</span>
          <span class="badge">{{ interventionsNonTerminees.length }}</span>
        </div>
        <div class="table-body">
          <table *ngIf="interventionsNonTerminees.length > 0">
            <thead>
              <tr><th>Date</th><th>Type</th><th>Équipement</th><th>Statut</th></tr>
            </thead>
            <tbody>
              <tr *ngFor="let i of interventionsNonTerminees" (click)="navigateTo('/interventions/' + i.id)" class="clickable">
                <td>{{ i.dateIntervention | date:'dd/MM' }}</td>
                <td>{{ i.type }}</td>
                <td>{{ i.equipement?.nom || '—' }}</td>
                <td><span [class]="'badge-statut ' + getStatutClass(i.statut)">{{ i.statut }}</span></td>
              </tr>
            </tbody>
          </table>
          <div *ngIf="interventionsNonTerminees.length === 0" class="empty-state">✅ Toutes les interventions sont terminées</div>
        </div>
      </div>

      <!-- Interventions urgentes (7 jours) -->
      <div class="table-card">
        <div class="table-header red-header">
          <span>🔴 Interventions dans 7 jours</span>
          <span class="badge">{{ interventionsUrgentes.length }}</span>
        </div>
        <div class="table-body">
          <table *ngIf="interventionsUrgentes.length > 0">
            <thead>
              <tr><th>Date</th><th>Type</th><th>Équipement</th><th>FSE</th></tr>
            </thead>
            <tbody>
              <tr *ngFor="let i of interventionsUrgentes" (click)="navigateTo('/interventions/' + i.id)" class="clickable urgent">
                <td>{{ i.dateIntervention | date:'dd/MM' }}</td>
                <td>{{ i.type }}</td>
                <td>{{ i.equipement?.nom || '—' }}</td>
                <td>{{ i.nomFse || '—' }}</td>
              </tr>
            </tbody>
          </table>
          <div *ngIf="interventionsUrgentes.length === 0" class="empty-state">Aucune intervention urgente</div>
        </div>
      </div>

    </div>

  </ng-container>
</div>
