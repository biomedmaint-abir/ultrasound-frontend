<div class="page-container">
  <div class="page-header">
    <div class="header-left">
      <button class="back-btn" (click)="cancel()">←</button>
      <div>
        <h1>{{ isEditMode ? 'Modifier l\'équipement' : 'Nouvel équipement' }}</h1>
        <p>Les champs marqués <span class="required-star">*</span> sont obligatoires</p>
      </div>
    </div>
  </div>

  <div *ngIf="errorMessage" class="error-banner">⚠️ {{ errorMessage }}</div>
  <div *ngIf="submitted && !isFormValid" class="validation-banner">⚠️ Veuillez remplir tous les champs obligatoires.</div>

  <div class="form-card">
    <div class="form-grid">

      <div class="field-wrapper" [class.invalid]="isInvalid(form.nom)">
        <div class="field-label">
          <span class="field-icon">🖥️</span>
          <label>Modèle <span class="required-star">*</span></label>
        </div>
        <select [(ngModel)]="form.nom" name="nom" class="form-select">
          <option value="">-- Sélectionner un modèle --</option>
          <option *ngFor="let m of modeles" [value]="m">{{ m }}</option>
        </select>
        <span class="error-msg" *ngIf="isInvalid(form.nom)">Ce champ est obligatoire</span>
      </div>

      <div class="field-wrapper" [class.invalid]="isInvalid(form.numeroSerie)">
        <div class="field-label">
          <span class="field-icon">📊</span>
          <label>Numéro de série <span class="required-star">*</span></label>
        </div>
        <input type="text" [(ngModel)]="form.numeroSerie" name="numeroSerie" class="form-input" placeholder="Ex : US720D1272">
        <span class="error-msg" *ngIf="isInvalid(form.numeroSerie)">Ce champ est obligatoire</span>
      </div>

      <div class="field-wrapper">
        <div class="field-label">
          <span class="field-icon">🏷️</span>
          <label>N° Inventaire</label>
        </div>
        <input type="text" [(ngModel)]="form.numInventaire" name="numInventaire" class="form-input" placeholder="Ex : 34567">
      </div>

      <div class="field-wrapper">
        <div class="field-label">
          <span class="field-icon">🏥</span>
          <label>Service <span class="required-star">*</span></label>
        </div>
        <select [(ngModel)]="form.service" name="service" class="form-select">
          <option value="">-- Sélectionner un service --</option>
          <option *ngFor="let s of services" [value]="s">{{ s }}</option>
        </select>
      </div>

      <div class="field-wrapper" [class.invalid]="isInvalid(form.parc)">
        <div class="field-label">
          <span class="field-icon">📍</span>
          <label>Parc <span class="required-star">*</span></label>
        </div>
        <select [(ngModel)]="form.parc" name="parc" class="form-select">
          <option value="">-- Sélectionner un parc --</option>
          <option *ngFor="let p of parcs" [value]="p">{{ p }}</option>
        </select>
        <span class="error-msg" *ngIf="isInvalid(form.parc)">Ce champ est obligatoire</span>
      </div>

      <div class="field-wrapper">
        <div class="field-label">
          <span class="field-icon">📅</span>
          <label>Date d'installation <span class="required-star">*</span></label>
        </div>
        <input type="date" [(ngModel)]="form.dateInstallation" name="dateInstallation" class="form-input">
      </div>

      <div class="field-wrapper" [class.invalid]="isInvalid(form.statut)">
        <div class="field-label">
          <span class="field-icon">🛡️</span>
          <label>Statut <span class="required-star">*</span></label>
        </div>
        <select [(ngModel)]="form.statut" name="statut" class="form-select">
          <option value="">-- Sélectionner un statut --</option>
          <option *ngFor="let s of statuts" [value]="s">{{ s }}</option>
        </select>
        <span class="error-msg" *ngIf="isInvalid(form.statut)">Ce champ est obligatoire</span>
      </div>

    </div>

    <div class="form-actions">
      <button class="btn-cancel" (click)="cancel()" [disabled]="isSaving">Annuler</button>
      <button class="btn-save" (click)="save()" [disabled]="isSaving">
        💾 {{ isSaving ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>
  </div>
</div>
